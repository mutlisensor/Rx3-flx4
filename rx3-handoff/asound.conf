# One hardware stream shared by the RX3's master and headphone PCM devices. Both pass at unity gain: master and
# headphones use separate channels (1/2 and 3/4), so nothing is summed, and the firmware keeps its own headroom.
pcm.rx3mix {
 type dmix
 ipc_key 5396531
 ipc_key_add_uid true
 slave {
  pcm "hw:2,0"
  format S16_LE
  rate 44100
  channels 4
  period_size 128
  buffer_size 512
 }
 bindings { 0 0 1 1 2 2 3 3 }
}
pcm.rx3out {
 type plug
 slave.pcm {
  type route
  slave { pcm "rx3mix" channels 4 }
  ttable { 0.0 1.0 1.1 1.0 }
 }
}
pcm.rx3cue {
 type plug
 slave.pcm {
  type route
  slave { pcm "rx3mix" channels 4 }
  ttable { 0.2 1.0 1.3 1.0 }
 }
}
